name: Docker Build

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_token:
        required: true
    outputs:
      image_url:
        description: "The full image name and tag"
        # We point directly to the job-level output
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Map the step output to the job output
    outputs:
      image_tag: ${{ steps.meta.outputs.image }} 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          # Create the string. Ensure no trailing spaces or hidden characters.
          # Using the lowercase secret names defined in workflow_call.
          IMAGE_PATH="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
          echo "image=$IMAGE_PATH" >> $GITHUB_OUTPUT
          
          # Debug: This will show up in the logs of the BUILD job
          echo "Internal Variable Check: $IMAGE_PATH"

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          # Reference the output from the meta step
          tags: ${{ steps.meta.outputs.image }}