name: Docker Build

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_token:
        required: true
    outputs:
      image_url:
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-output.outputs.image }} 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          echo "username=${{ secrets.DOCKER_USERNAME }}"
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}"
          echo "image=$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_ENV

      - name: Set final output
        id: set-output
        run: |
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Debug inside reusable
        run: echo "FINAL IMAGE = $IMAGE"

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          tags: ${{ steps.meta.outputs.image }}