name: Docker Build

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_token:
        required: true
    outputs:
      image_url:
        description: "The full image name and tag"
        # This maps the Job output to the Step output
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Map the step output to the job output
    outputs:
      image_tag: ${{ steps.meta.outputs.image }} 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Set image metadata
        id: meta
        run: |
          # Use the secrets as defined in the 'secrets' block above (lowercase)
          # We define a local variable and immediately write it to the output file
          FULL_IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
          echo "image=$FULL_IMAGE" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          # Use the output from the 'meta' step
          tags: ${{ steps.meta.outputs.image }}