name: Health Check

on:
#  schedule:
 #   - cron: '0 */12 * * *'   # every 12 hours
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest Docker image
        run: docker pull aakash969/day-48-node-app:latest

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name health-container \
          -e MONGO_URI="mongodb://localhost:27017/test" \
          aakash969/day-48-node-app:latest

      - name: Wait for app to start
        run: sleep 5

      - name: Health Check (curl)
        id: health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/)
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [ "$STATUS" -eq 200 ]; then
            echo "PASSED"
          else
            echo "FAILED"
            exit 1
          fi

      - name: Stop and remove container
        if: always() # run if pass or fail
        run: |
          docker stop health-container || true
          docker rm health-container || true

      - name: Create Summary
        if: always()
        run: |
          echo "## Health Check Report" >> $GITHUB_STEP_SUMMARY
          echo "- Image: aakash969/day-48-node-app:latest" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.health.outputs.status }}" = "200" ]; then
            echo "- Status: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Time: $(date)" >> $GITHUB_STEP_SUMMARY