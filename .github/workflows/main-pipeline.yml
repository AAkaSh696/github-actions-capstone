name: Main Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    # Assuming this file exists in your repository
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      node_version: "18"

  docker:
    needs: test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: "day-48-node-app"
      tag: latest
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }} 

  security-scan:
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Debug docker output
        run: 'echo "Scanning image: ${{ needs.docker.outputs.image_url }}"'
        
      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.docker.outputs.image_url }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: [docker] # Changed to depend on scan passing
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        run: echo "Deploying ${{ needs.docker.outputs.image_url }} to production"