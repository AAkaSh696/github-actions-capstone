name: Main Pipeline

on:
  push:
    branches: [main]

# Permissions are sometimes required for outputs to propagate in certain Org settings
permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      node_version: "18"

  docker:
    needs: test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: "day-48-node-app"
      tag: "latest"
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }} 

  security-scan:
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Output Reception
        run: |
          echo "The received image URL is: ${{ needs.docker.outputs.image_url }}"
          if [ -z "${{ needs.docker.outputs.image_url }}" ]; then
            echo "ERROR: Image URL is empty"
            exit 1
          fi
        
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          # If image_url is still empty, this is where it fails.
          image-ref: ${{ needs.docker.outputs.image_url }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'