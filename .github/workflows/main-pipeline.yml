name: Main Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      node_version: "18"

  docker:
    needs: test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: "day-48-node-app"
      tag: "latest"
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }} 

  security-scan:
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Debug docker output
        # This should now print: Scanning image: username/day-48-node-app:latest
        run: |
          echo "OUTPUT CHECK: ${{ needs.docker.outputs.image_url }}"
        
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.docker.outputs.image_url }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'